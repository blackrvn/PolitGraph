name: Docker - politgraph.ui

on:
  push:
    branches: [ "main" ]
    paths:
      - "politgraph.ui/**"
      - ".github/workflows/docker_build.yml"
      - ".github/workflows/deploy_infra.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/publish_ui.yml"
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "politgraph.ui/**"

jobs:
  docker:
    uses: ./.github/workflows/docker_build.yml
    with:
      dockerfile: politgraph.ui/Dockerfile
      image_name: "politgraph-ui"
    secrets: inherit
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
